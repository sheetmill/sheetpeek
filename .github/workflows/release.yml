# Release: `gh release create vX.Y.Z --target main` creates the tag on GitHub and starts this
# workflow; the tag must match `__version__`. The workflow first requires a successful run of
# the CI workflow on the tagged commit, pushed to main (it does not run CI again), checks the
# tag against the package version, builds once, publishes to TestPyPI, installs that release
# from TestPyPI and renders a small workbook with it, then publishes the same files to PyPI.
#
# Publishing uses trusted publishing (OpenID Connect), so no token is stored. Configure on
# test.pypi.org and pypi.org a trusted publisher for owner `sheetmill`, repository
# `sheetpeek`, workflow `release.yml`, environments `testpypi` and `pypi`. Give the GitHub
# environment `pypi` a required reviewer, so the PyPI step waits for manual approval.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci-passed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: The CI workflow passed on this commit, pushed to main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          runs=$(gh api "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${SHA}&event=push&branch=main&per_page=100" \
            --jq '.workflow_runs[] | "\(.id) \(.status) \(.conclusion) \(.head_branch) \(.html_url)"')
          echo "CI runs on ${SHA} (event push, branch main): id status conclusion branch url"
          echo "${runs:-none}"
          echo "${runs}" | grep -q '^[0-9]* completed success main ' || { echo "no successful CI run on ${SHA} pushed to main"; exit 1; }

  build:
    needs: ci-passed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: The tag matches the package version
        run: |
          version=$(uv run --no-project python -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('src/sheetpeek/__init__.py').read())[1])")
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
      - run: uv build
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/sheetpeek/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  verify-testpypi:
    needs: testpypi
    runs-on: ubuntu-latest
    steps:
      - uses: astral-sh/setup-uv@v5
      - name: Install the release from TestPyPI and render a workbook
        run: |
          version="${GITHUB_REF_NAME#v}"
          uv venv /tmp/env
          # Only sheetpeek itself is taken from TestPyPI; its dependencies, as its own metadata
          # declares them, come from PyPI.
          # TestPyPI's index can lag the upload by a minute.
          for attempt in 1 2 3 4 5 6; do
            uv pip install -p /tmp/env --no-cache --no-deps --index-url https://test.pypi.org/simple/ "sheetpeek==${version}" && break
            sleep 20
          done
          /tmp/env/bin/python -I -c "from importlib.metadata import requires; print('\n'.join(r for r in requires('sheetpeek') if 'extra ==' not in r))" > /tmp/requirements.txt
          cat /tmp/requirements.txt
          uv pip install -p /tmp/env -r /tmp/requirements.txt
          uv pip install -p /tmp/env openpyxl  # builds the check's workbook; not a dependency
          SHEETPEEK_VERSION="${version}" /tmp/env/bin/python -I - <<'PY'
          import os, pathlib, tempfile
          import openpyxl, sheetpeek
          assert sheetpeek.__version__ == os.environ["SHEETPEEK_VERSION"]
          path = pathlib.Path(tempfile.mkdtemp()) / "check.xlsx"
          wb = openpyxl.Workbook()
          wb.active["A1"] = 1234.5
          wb.active["A1"].number_format = "#,##0.00"
          wb.save(path)
          text = sheetpeek.render(path, "text")
          assert text == "1,234.50\n", repr(text)
          assert sheetpeek.render(path, "html").startswith("<!doctype html>")
          print(sheetpeek.__version__, text, end="")
          PY

  pypi:
    needs: verify-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/sheetpeek/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
